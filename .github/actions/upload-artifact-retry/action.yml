name: Upload artifact with retry
description: >
  Runs actions/upload-artifact up to three times. The artifact service
  intermittently answers with transient errors (for example
  `403 Error from intermediary` on FinalizeArtifact) that the action itself
  treats as non-retryable. Retries set `overwrite: true`, because a failed
  attempt may already have created the artifact server-side.
inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: A file, directory or wildcard pattern that describes what to upload.
    required: true
  if-no-files-found:
    description: Behavior when no files match the path (warn, error, ignore).
    required: false
    default: warn
outputs:
  artifact-id:
    description: ID of the uploaded artifact.
    value: ${{ steps.attempt1.outputs.artifact-id || steps.attempt2.outputs.artifact-id || steps.attempt3.outputs.artifact-id }}
  artifact-url:
    description: Download URL of the uploaded artifact.
    value: ${{ steps.attempt1.outputs.artifact-url || steps.attempt2.outputs.artifact-url || steps.attempt3.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - name: Upload artifact
      id: attempt1
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}

    - name: Wait before retrying
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Artifact upload failed, retrying in 15s"
        sleep 15

    - name: Upload artifact (retry 1)
      id: attempt2
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true

    - name: Wait before retrying
      if: steps.attempt2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Artifact upload failed again, retrying in 45s"
        sleep 45

    - name: Upload artifact (retry 2)
      id: attempt3
      if: steps.attempt2.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true
