name: E2E ACME

# Real HTTP-01 issuance against Pebble (a test ACME CA) with the official
# nginx-ui image built from this commit. See e2e/acme/README.md.
on:
  schedule:
    - cron: "37 19 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: e2e-acme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acme:
    name: Pebble HTTP-01
    # On pull requests only when the e2e-acme label is present, and on a
    # "labeled" event only when that label is the one being added.
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'e2e-acme') &&
        (github.event.action != 'labeled' || github.event.label.name == 'e2e-acme')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NGINX_UI_IMAGE: nginx-ui-acme-e2e:ci
      E2E_ACME_BINARY: native
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ^1.27.1
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Build frontend
        run: |
          bun ci
          bun run build

      # Native linux/amd64 CGO build with the release flags, then the official
      # Dockerfile on top of it.
      - name: Build nginx-ui image
        run: sh e2e/acme/scripts/build-image.sh

      - name: Install Playwright
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Start ACME stack
        run: sh e2e/acme/scripts/up.sh

      - name: Run ACME E2E
        working-directory: e2e
        run: bun run test:acme

      - name: Collect container logs
        if: always()
        run: sh e2e/acme/scripts/logs.sh || true

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-acme-report
          path: |
            e2e/acme/playwright-report
            e2e/acme/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop ACME stack
        if: always()
        run: sh e2e/acme/scripts/down.sh
