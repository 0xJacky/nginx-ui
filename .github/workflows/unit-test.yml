name: Unit Tests

on:
  push:
    branches-ignore:
      - weblate
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - install.sh
      - tests/install_openwrt_test.sh
      - resources/services/nginx-ui.openwrt
      - resources/keep.openwrt
      - "packaging/openwrt/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/unit-test.yml"
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - install.sh
      - tests/install_openwrt_test.sh
      - resources/services/nginx-ui.openwrt
      - resources/keep.openwrt
      - "packaging/openwrt/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/unit-test.yml"

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: >-
          go test -tags=unembed -race -cover -count=1 ./...

  openwrt-install:
    name: OpenWrt installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test installer detection and paths
        run: bash tests/install_openwrt_test.sh

      - name: Verify OpenWrt SDK mirror
        env:
          OPENWRT_VERSION: 25.12.5
        run: |
          set -euo pipefail
          targets=(
            x86/64
            armsr/armv8
            mediatek/filogic
            armsr/armv7
            ipq40xx/generic
            sifiveu/generic
          )
          for target in "${targets[@]}"; do
            curl --retry 3 --retry-all-errors --retry-delay 2 \
              -fsSLo /dev/null \
              "https://mirror-03.infra.openwrt.org/releases/${OPENWRT_VERSION}/targets/${target}/sha256sums"
          done
