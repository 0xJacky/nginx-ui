# Plumber checks the repository's own GitHub Actions workflows for CI/CD supply-chain
# issues: unpinned third-party actions, tokens granted more than a job needs, checkout
# credentials left readable by later steps, and similar. Findings land in the Security tab
# next to CodeQL's, as SARIF.
#
# It does not fail the build. soft-fail below means a finding is reported and never blocks
# a merge, which is the right setting while the score is still moving. Once it has settled,
# `min-score: <letter>` turns this into a ratchet: the build then fails only if a change
# makes the score worse than it is today.
name: Plumber

on:
  push:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/**'
      - '.plumber.yaml'
  pull_request:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/**'
      - '.plumber.yaml'
  # Some of what Plumber reads lives outside the tree and changes without a commit: a tag
  # that moves under an unpinned action, a new advisory against one already in use, the
  # branch protection settings. The weekly run is what catches those, and it is also what
  # keeps the README badge current between workflow changes.
  schedule:
    - cron: '17 6 * * 1'

# The work is the same on either path and only the token grant differs, which is why this
# is two jobs rather than one. Publishing the score needs an OIDC token, and a job that
# runs on a pull request has no use for one, so it is not granted there.
jobs:
  score:
    name: Plumber Score
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plumber Score
        uses: getplumber/plumber@d1133cdac48cfdf0c0004637ae4af38bcf9f16c7 # v0.7.11
        with:
          soft-fail: true
          upload-sarif: false

      # A finding nested in a remote composite action gets a related location
      # pointing at that action's GitHub blob URL. Code Scanning only accepts
      # files of this checkout and rejects the whole upload over it, so drop
      # those locations; the finding's message still names where it lives.
      - name: Keep only repository paths in the SARIF
        if: ${{ always() && hashFiles('plumber.sarif') != '' }}
        run: |
          jq '(.runs[]?.results[]? | select(.relatedLocations)) |= (.relatedLocations |= map(select(.physicalLocation.artifactLocation.uri // "" | test("^[A-Za-z][A-Za-z0-9+.-]*:") | not)) | if .relatedLocations == [] then del(.relatedLocations) else . end)' plumber.sarif > plumber.sarif.tmp
          mv plumber.sarif.tmp plumber.sarif

      - name: Upload SARIF to Code Scanning
        if: ${{ always() && hashFiles('plumber.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: plumber.sarif

  publish:
    name: Plumber Score (publish)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      # Minted for score-push below and used for nothing else. The score service
      # authenticates the run with this token instead of a stored secret.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plumber Score
        uses: getplumber/plumber@d1133cdac48cfdf0c0004637ae4af38bcf9f16c7 # v0.7.11
        with:
          soft-fail: true
          upload-sarif: false
          # Publishes this repository's score, and its name, to the public badge
          # service that backs the README badge. Only the default branch is shown.
          score-push: true

      # Same cleanup as the score job above.
      - name: Keep only repository paths in the SARIF
        if: ${{ always() && hashFiles('plumber.sarif') != '' }}
        run: |
          jq '(.runs[]?.results[]? | select(.relatedLocations)) |= (.relatedLocations |= map(select(.physicalLocation.artifactLocation.uri // "" | test("^[A-Za-z][A-Za-z0-9+.-]*:") | not)) | if .relatedLocations == [] then del(.relatedLocations) else . end)' plumber.sarif > plumber.sarif.tmp
          mv plumber.sarif.tmp plumber.sarif

      - name: Upload SARIF to Code Scanning
        if: ${{ always() && hashFiles('plumber.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: plumber.sarif
