# Plumber checks the repository's own GitHub Actions workflows for CI/CD supply-chain
# issues: unpinned third-party actions, tokens granted more than a job needs, checkout
# credentials left readable by later steps, and similar. Findings land in the Security tab
# next to CodeQL's, as SARIF.
#
# It does not fail the build. soft-fail below means a finding is reported and never blocks
# a merge, which is the right setting while the score is still moving. Once it has settled,
# `min-score: <letter>` turns this into a ratchet: the build then fails only if a change
# makes the score worse than it is today.
name: Plumber

on:
  push:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/**'
      - '.plumber.yaml'
  pull_request:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/**'
      - '.plumber.yaml'
  # Some of what Plumber reads lives outside the tree and changes without a commit: a tag
  # that moves under an unpinned action, a new advisory against one already in use, the
  # branch protection settings. The weekly run is what catches those, and it is also what
  # keeps the README badge current between workflow changes.
  schedule:
    - cron: '17 6 * * 1'

# The work is the same on either path and only the token grant differs, which is why this
# is two jobs rather than one. Publishing the score needs an OIDC token, and a job that
# runs on a pull request has no use for one, so it is not granted there.
jobs:
  score:
    name: Plumber Score
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plumber Score
        uses: getplumber/plumber@ad42e1a68a4e0f5d815eea6b43f03a6f1f207345 # v0.5.24
        with:
          soft-fail: true

  publish:
    name: Plumber Score (publish)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      # Minted for score-push below and used for nothing else. The score service
      # authenticates the run with this token instead of a stored secret.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plumber Score
        uses: getplumber/plumber@ad42e1a68a4e0f5d815eea6b43f03a6f1f207345 # v0.5.24
        with:
          soft-fail: true
          # Publishes this repository's score, and its name, to the public badge
          # service that backs the README badge. Only the default branch is shown.
          score-push: true
