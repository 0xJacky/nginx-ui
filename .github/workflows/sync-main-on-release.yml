name: Sync branch

on:
  workflow_dispatch:
  release:
    types: [published]
    branches: [dev]

permissions:
  contents: read

jobs:
  force-push-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev
          clean: false
          # persist-credentials stays on here: the force push below is
          # authenticated by the credential this checkout stores.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Force push dev to main
        run: |
          git fetch origin
          git push origin dev:main --force
