[app]
PageSize  = 20
JwtSecret =

[server]
Host    = 0.0.0.0
Port    = 9000
RunMode = debug
EnableHTTPS = false
EnableH2 = false
EnableH3 = false

[listener]
# Optional absolute Unix socket path; empty keeps server Host/Port.
UnixSocket =
# Octal permission applied to the socket, default 0666 so the reverse proxy user can connect.
SocketMode =

[database]
Name = database

[auth]
IPWhiteList         =
TrustedProxies      =
BanThresholdMinutes = 10
MaxAttempts         = 10
SecureSessionTimeoutMinutes = 10

[casdoor]
Endpoint        =
ClientId        =
ClientSecret    =
CertificatePath =
Organization    =
Application     =
RedirectUri     =

[oidc]
ClientId     =
ClientSecret =
Endpoint     =
RedirectUri  =
Scopes       =
Identifier   =

[cert]
Email                =
CADir                =
RenewalInterval      = 30
RecursiveNameservers =
HTTPChallengePort    = 9180

[cluster]
Node = http://10.0.0.1:9000?name=node1&node_secret=my-node-secret&enabled=true
Node = http://10.0.0.2:9000?name=node2&node_secret=my-node-secret&enabled=true
Node = http://10.0.0.3?name=node3&node_secret=my-node-secret&enabled=true

[crypto]
Secret =

[http]
GithubProxy        = https://mirror.ghproxy.com/
HTTPProxy          = http://proxy.example.com:8080
InsecureSkipVerify = false
WebSocketTrustedOrigins =

[logrotate]
Enabled  = false
CMD      = logrotate /etc/logrotate.d/nginx
Interval = 1440

[nginx]
AccessLogPath   = /var/log/nginx/access.log
ErrorLogPath    = /var/log/nginx/error.log
LogDirWhiteList = /var/log/nginx
ConfigDir       =
PIDPath         =
TestConfigCmd   =
ReloadCmd       = nginx -s reload
RestartCmd      = start-stop-daemon --start --quiet --pidfile /var/run/nginx.pid --exec /usr/sbin/nginx
; Directory that custom maintenance page templates are loaded from.
MaintenanceDir  = /etc/nginx/maintenance
; Template file name in MaintenanceDir used for site maintenance mode pages.
MaintenanceTemplate = maintenance.html

[nginx_log]
; Log analytics moved into the official "Log Analytics" plugin (com.nginxui.log-analytics).
; Install the plugin from the Plugins page to search logs and see the traffic dashboard.
; The two keys below are only read to hand a node that used the earlier built-in indexing
; over to the plugin, they are not written by the UI anymore. The old settings
; IncrementalIndexInterval, MaxConcurrentIndexTasks, IndexCustomMMDB and GeoMapPath are
; copied into the plugin settings during that handoff.
IndexingEnabled          = false
IndexPath                =

[node]
Name             = Local
Secret           =
SkipInstallation = false
Demo             = false

[openai]
Provider = openai
BaseUrl =
Token   =
Proxy   =
Model   = gpt-4o
APIType =
EnableCodeCompletion = false
CodeCompletionModel = gpt-4o-mini

[site_check]
; Enable or disable the periodic Site Checker that probes every server_name.
Enabled         = true
; Maximum concurrent health checks per sweep. Clamped to [1, 20].
Concurrency     = 5
; Interval between sweeps, in seconds. Minimum 30.
IntervalSeconds = 300

[upstream_check]
; Enable or disable active availability probes for proxy and upstream targets.
Enabled         = true
; Interval between availability probes, in seconds. Minimum 5.
IntervalSeconds = 30

[terminal]
StartCmd = bash

[webauthn]
RPDisplayName = Nginx UI
RPID          = localhost
RPOrigins     = http://localhost:3002,http://127.0.0.1:3002,http://192.168.31.158:3002,http://example.com
