# Demo-only front proxy. Same as resources/docker/nginx-ui.conf except it
# listens on 8080 instead of 80, because the demo container runs unprivileged
# and cannot bind a port below 1024. The Cloudflare Container binding targets
# 8080 directly, so nothing external depends on the port number. It also
# serves the boot log and does not log requests; both are explained below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen       8080;
    server_name  localhost;
    client_max_body_size 128M;

    # Visitors browsing the demo must not land in the indexed access log. The
    # http block logs every server to /var/log/nginx/access.log, which holds
    # the generated fixture: without this, the UI's own polling would be
    # appended to it, re-indexed every incremental run, and shown to the next
    # visitor in the dashboard and log viewer, forwarded addresses included.
    # Not a separate file either: nginx-ui discovers access_log paths from the
    # config and would index that one too.
    access_log off;

    # Boot log, so a container whose nginx-ui failed to start can still be
    # diagnosed from outside. Serving it needs no working backend, which is the
    # entire point: this is reachable exactly when nothing else is.
    location = /__demo/bootlog {
        default_type text/plain;
        alias /var/log/nginx/demo-boot.log;
    }

    location / {
        proxy_set_header   Host                 $http_host;
        proxy_set_header   X-Real-IP            $remote_addr;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $forwarded_proto;
        proxy_set_header   X-Forwarded-Host     $forwarded_host;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade              $http_upgrade;
        proxy_set_header   Connection           $connection_upgrade;
        proxy_pass http://127.0.0.1:9000/;
    }
}
