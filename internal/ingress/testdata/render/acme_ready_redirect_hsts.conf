# ---- site ingress-secure
# Managed by Nginx UI ingress secure
# Generated from the ingress spec; manual changes are overwritten.
# Upstreams: ig-secure-app
map $http_upgrade $ig_secure_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=ig_secure:10m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name secure.example.com;
    location ^~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name secure.example.com;
    ssl_certificate /etc/nginx/ssl/example/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/example/private.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_req zone=ig_secure;
        proxy_pass http://ig-secure-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ig_secure_connection;
    }
}
# ---- upstream ig-secure-app
# Managed by Nginx UI: edit this upstream from the Upstream page.
# Sites reference it with `proxy_pass http://ig-secure-app;`.
upstream ig-secure-app {
    zone ig-secure-app 64k;
    server 127.0.0.1:24001;
}
