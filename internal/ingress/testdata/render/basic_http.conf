# ---- site ingress-basic
# Managed by Nginx UI ingress basic
# Generated from the ingress spec; manual changes are overwritten.
# Upstreams: ig-basic-app
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    location / {
        proxy_pass http://ig-basic-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
# ---- upstream ig-basic-app
# Generated by an Nginx UI ingress: change the ingress, not this upstream;
# its next apply overwrites edits made here.
# Sites reference it with `proxy_pass http://ig-basic-app;`.
upstream ig-basic-app {
    zone ig-basic-app 64k;
    server 127.0.0.1:24001;
}
