# ---- site ingress-shop
# Managed by Nginx UI ingress shop
# Generated from the ingress spec; manual changes are overwritten.
# Upstreams: ig-shop-api ig-shop-web
map $http_upgrade $ig_shop_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com www.shop.example.com;
    location / {
        proxy_pass http://ig-shop-web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /api/ {
        client_max_body_size 64m;
        proxy_pass http://ig-shop-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /ws {
        proxy_pass http://ig-shop-web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ig_shop_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
# ---- upstream ig-shop-api
# Managed by Nginx UI: edit this upstream from the Upstream page.
# Sites reference it with `proxy_pass http://ig-shop-api;`.
upstream ig-shop-api {
    ip_hash;
    zone ig-shop-api 64k;
    server [::1]:24010;
}
# ---- upstream ig-shop-web
# Managed by Nginx UI: edit this upstream from the Upstream page.
# Sites reference it with `proxy_pass http://ig-shop-web;`.
upstream ig-shop-web {
    least_conn;
    zone ig-shop-web 64k;
    server 127.0.0.1:24001 weight=3 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:24002 down;
    server 127.0.0.1:24003 backup;
    keepalive 16;
}
