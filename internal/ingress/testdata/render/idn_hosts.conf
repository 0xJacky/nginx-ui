# Managed by Nginx UI ingress idn
# Generated from the ingress spec; manual changes are overwritten.
# Upstreams: ig-idn-app
server {
    listen 80;
    listen [::]:80;
    server_name xn--fsqu00a.xn--0zwm56d xn--bcher-kva.example.com ab--cd.example.com;
    location / {
        proxy_pass http://ig-idn-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
