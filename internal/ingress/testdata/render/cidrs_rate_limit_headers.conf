# ---- site ingress-guarded
# Managed by Nginx UI ingress guarded
# Generated from the ingress spec; manual changes are overwritten.
# Upstreams: ig-guarded-app
limit_req_zone $binary_remote_addr zone=ig_guarded:10m rate=20r/s;
server {
    listen 80;
    listen [::]:80;
    server_name guarded.example.com;
    location / {
        allow 203.0.113.0/24;
        deny all;
        limit_req zone=ig_guarded burst=40 nodelay;
        client_max_body_size 16m;
        proxy_pass http://ig-guarded-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Source "ingress controller";
    }
    location ^~ /admin {
        allow 10.0.0.0/8;
        allow 2001:db8::1;
        deny all;
        limit_req zone=ig_guarded burst=40 nodelay;
        client_max_body_size 16m;
        proxy_pass http://ig-guarded-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Source "ingress controller";
    }
}
# ---- upstream ig-guarded-app
# Generated by an Nginx UI ingress: change the ingress, not this upstream;
# its next apply overwrites edits made here.
# Sites reference it with `proxy_pass http://ig-guarded-app;`.
upstream ig-guarded-app {
    zone ig-guarded-app 64k;
    server 127.0.0.1:24001;
}
