# ---- site ingress-pending
# Managed by Nginx UI ingress pending
# Generated from the ingress spec; manual changes are overwritten.
# Upstreams: ig-pending-app
map $http_upgrade $ig_pending_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name pending.example.com;
    location ^~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
    location / {
        proxy_pass http://ig-pending-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ig_pending_connection;
    }
}
# ---- upstream ig-pending-app
# Managed by Nginx UI: edit this upstream from the Upstream page.
# Sites reference it with `proxy_pass http://ig-pending-app;`.
upstream ig-pending-app {
    zone ig-pending-app 64k;
    server 127.0.0.1:24001;
}
