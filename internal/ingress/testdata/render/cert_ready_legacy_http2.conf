# ---- site ingress-legacy
# Managed by Nginx UI ingress legacy
# Generated from the ingress spec; manual changes are overwritten.
# Upstreams: ig-legacy-app
server {
    listen 80;
    listen [::]:80;
    server_name *.legacy.example.com;
    location / {
        proxy_pass http://ig-legacy-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.legacy.example.com;
    ssl_certificate /etc/nginx/ssl/example/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/example/private.key;
    location / {
        proxy_pass http://ig-legacy-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
# ---- upstream ig-legacy-app
# Managed by Nginx UI: edit this upstream from the Upstream page.
# Sites reference it with `proxy_pass http://ig-legacy-app;`.
upstream ig-legacy-app {
    zone ig-legacy-app 64k;
    server 127.0.0.1:24001;
}
